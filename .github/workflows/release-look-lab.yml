name: Release BIONZ Look Lab

on:
  push:
    tags:
      - "look-lab-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Generate bionz-golden fixtures
        run: |
          python -m pip install --quiet numpy
          python apps/lut-converter/tools/export_golden.py --golden-only

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run non-GPU Rust workspace tests
        working-directory: apps/isp-studio
        run: cargo test --workspace --exclude bionz-py --exclude bionz-gpu -- --skip chart_develops_identically_on_gpu_and_cpu --skip render_worker_keeps_only_the_newest_request

      - name: Build portable Windows package
        shell: pwsh
        run: .\scripts\build_look_lab_release.ps1 -SkipTests

      - name: Verify standalone export from an empty folder
        shell: pwsh
        run: .\scripts\verify_look_lab_export.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIONZ-Look-Lab-win64-portable
          if-no-files-found: error
          path: |
            dist/BIONZ-Look-Lab-win64-portable.zip
            dist/BIONZ-Look-Lab-portable/bionz-look-lab.exe
            dist/SHA256SUMS.txt

  build-posix:
    name: ${{ matrix.title }} Portable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            title: macOS arm64
            bundle: macos-arm64
          - os: ubuntu-latest
            title: Linux x64
            bundle: linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Generate bionz-golden fixtures
        run: |
          python -m pip install --quiet numpy
          python apps/lut-converter/tools/export_golden.py --golden-only

      - name: Install UI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run non-GPU Rust workspace tests
        working-directory: apps/isp-studio
        run: cargo test --workspace --exclude bionz-py --exclude bionz-gpu -- --skip chart_develops_identically_on_gpu_and_cpu --skip render_worker_keeps_only_the_newest_request

      - name: Build portable package
        run: scripts/build_look_lab_release.sh --skip-tests

      - name: Check the bundle matches the expected host
        run: test -f "dist/BIONZ-Look-Lab-${{ matrix.bundle }}.tar.gz"

      - name: Verify standalone export from an empty folder
        run: scripts/verify_look_lab_export.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIONZ-Look-Lab-${{ matrix.bundle }}
          if-no-files-found: error
          path: |
            dist/BIONZ-Look-Lab-${{ matrix.bundle }}.tar.gz
            dist/SHA256SUMS-${{ matrix.bundle }}.txt

  release:
    name: Create GitHub Release
    needs: [build-windows, build-posix]
    if: startsWith(github.ref, 'refs/tags/look-lab-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$RUNNER_TEMP/look-lab-release-notes.md"
          cat >"$notes" <<'EOF'
          Portable builds of **BIONZ Look Lab** for Windows x64 (`bionz-look-lab.exe`), macOS arm64 and Linux x64 (`bionz-look-lab` inside the `.tar.gz`).

          ### Highlights
          - **Self-contained executable:** the looks and the ARM mod template are compiled in; no Python, GCC, or WSL required. The Windows build statically links the MSVC CRT (`+crt-static`), so no Visual C++ Redistributable is needed.
          - **12 built-in Film Simulations:** Classic Chrome, Classic Neg, Portra 400, Gold 200, Vision3 800T, ETERNA, Eterna Bleach Bypass, Pro Negative, Reala Ace, Velvia, Astia, and Acros (compiled against verified `av-cam.bin` stock, Photo and Movie variants).
          - **Direct Camera Mod Export (`SMOD v2`):** exports single-look `.mod` files and the Live View **Live Picker** (`FilmSimulations.mod`) directly to `<SD>/mods/`.

          ### Supported Camera Bodies
          - **Sony ILCE-6400 (a6400)** — Ver. 2.00 with Mod Loader v2
          - **Sony ILCE-6100 (a6100)** — Ver. 1.00 with Mod Loader v2

          ### Verification & First-Launch Notes
          - The binaries are **unsigned**. On Windows, SmartScreen may prompt on first launch (*More info -> Run anyway*). On macOS the binary is not notarized: run `xattr -d com.apple.quarantine bionz-look-lab` once if Gatekeeper blocks it.
          - The Linux build needs an X11 or Wayland session with OpenGL; the window libraries are loaded from the system at start-up.
          - Verify download integrity against `SHA256SUMS.txt` (Windows) and `SHA256SUMS-<os>-<arch>.txt` (macOS, Linux).
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BIONZ Look Lab $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            release/BIONZ-Look-Lab-win64-portable.zip \
            release/BIONZ-Look-Lab-portable/bionz-look-lab.exe \
            release/SHA256SUMS.txt \
            release/BIONZ-Look-Lab-macos-arm64.tar.gz \
            release/SHA256SUMS-macos-arm64.txt \
            release/BIONZ-Look-Lab-linux-x64.tar.gz \
            release/SHA256SUMS-linux-x64.txt
