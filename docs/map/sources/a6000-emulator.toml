# Knowledge-map source: ILCE-6000 (CXD90014) sony-a6000 emulator.
# See docs/map/README.md for the schema. Claims cite evidence records; the record
# index on the generated page is extracted from the files themselves.

[meta]
area = "a6000-emulator"
title = "ILCE-6000 (CXD90014) sony-a6000 emulator"
scope = """
The sony-a6000 QEMU machine for the ILCE-6000 (CXD90014, firmware 3.21): boot from the owner's NAND dump or from a NAND built from Sony's updater alone, what such a NAND lacks, and the factory calibration paths. Not a CXD90045 body; nothing here is an a6400 claim."""
evidence_span = "see record index"
reviewed = "2026-11-28"
records = [
  "external-a6000-emulator/*",
]

[[entity]]
id = "a6000.board"
kind = "tool"
name = "QEMU sony-a6000 board"
aliases = ["sony-a6000", "ILCE-6000", "CXD90014", "emulators/a6000"]
summary = "Separate QEMU machine for the ILCE-6000 (CXD90014, firmware 3.21), ported from voxivoid/a6000-qemu; opt-in properties on the shared cxd90014_* models keep the a6400 defaults."

[[entity]]
id = "a6000.synthetic-nand"
kind = "tool"
name = "NAND built from the updater alone"
aliases = ["mknand_synth", "mknand_synth.py", "synthetic NAND"]
summary = "Logical NAND image from Sony's public 3.21 updater: partition images, factory-default Backup.bin template, DmmConfig.bin/ulogio.bin rebuilt from the warm-boot image, nflasha4 erased."

[[entity]]
id = "a6000.psd-bin"
kind = "source"
name = "/setting/psd.bin (phase-detect AF calibration)"
aliases = ["psd.bin", "A_PSD_DATA_WRITE", "A_PSD_DATA_READ", "ZPD", "0x4378947C", "0x000301D7"]
summary = "Per-unit ZPD calibration image (PF magic, XOR-0 words), written only by the factory adjust command and read by av-cam at lens attach."

[[entity]]
id = "a6000.backup-calibration"
kind = "field"
name = "Protected Backup.bin calibration props"
aliases = ["BK_PROTECT_ADJ", "0x00e70031", "0x013e0016", "0x0147", "usb_serial_set", "NsP2PGenerateBackUpCredential"]
summary = "Backup.bin properties with attribute bit 0x02, kept across updates and unset in the updater template: image adjustment tables, USB serial, Wi-Fi Direct credentials, WLAN channel range."

[[claim]]
id = "R01"
entities = ["a6000.board"]
status = "retracted"
text = "A contributor port adds a separate sony-a6000 machine for the ILCE-6000 (CXD90014, firmware 3.21) to the QEMU 11.1.3 tree. It boots only from the contributor's own NAND dump and matched the source QEMU 10.1.0 build screen for screen; it makes no CXD90045 claim, and its shared-model changes are opt-in properties whose defaults keep the a6400 behaviour."
evidence = ["doc:external-a6000-emulator/README.md"]
superseded_by = "C01"
note = "Moved from qemu-a6400 C25. The 2026-11-28 update of the receipt boots a NAND built from the updater alone, so 'only from the dump' no longer holds."

[[claim]]
id = "C01"
entities = ["a6000.board", "a6000.synthetic-nand"]
status = "verified-offline"
text = "The sony-a6000 machine boots firmware 3.21 to the shooting screen and menus both from the owner's NAND dump (matching the source QEMU 10.1.0 build screen for screen) and from a NAND built from Sony's public updater alone, with no dump on disk; run.sh maps the NAND read-only (snapshot) so the file's SHA-256 does not change. It makes no CXD90045 claim."
evidence = ["doc:external-a6000-emulator/README.md"]

[[claim]]
id = "C02"
entities = ["a6000.psd-bin"]
status = "verified-offline"
text = "/setting/psd.bin is written only by the factory adjust command A_PSD_DATA_WRITE (adjstctl.elf OSAL ID 0x000301D7, block 0x0404, code 0x63): av-cam's handler 0x4378947C checks the PF magic and a zero word XOR, then sends message type 8 to CameraOnDemandSaver.so, which writes the file. av-cam reads it at lens attach; normal use never writes it, so a NAND built from the updater has none."
evidence = ["doc:external-a6000-emulator/README.md"]

[[claim]]
id = "C03"
entities = ["a6000.backup-calibration", "a6000.synthetic-nand"]
status = "verified-offline"
text = "Per-unit calibration lives in Backup.bin props with attribute bit 0x02, kept across updates by Backup_rewrite(BK_PROTECT_ADJ) and unset in the updater template: image adjustment (subsystems 0x0003, 0x005f, 0x0060, 0x00bc, 0x0132), USB serial 0x00e70031, Wi-Fi Direct credentials 0x013e0016-0x013e0018 and WLAN channel range 0x0147*. The firmware boots with them unset."
evidence = ["doc:external-a6000-emulator/README.md"]

[[frontier]]
id = "F01"
title = "Synthetic NAND parity with a real body"
state = "open"
entities = ["a6000.synthetic-nand", "a6000.backup-calibration"]
evidence = ["doc:external-a6000-emulator/README.md"]
next = "Find why the synthetic NAND's shooting screen shows the SteadyShot warning icon (unset calibration or no lens); neutral calibration values only matter once a sensor, ISP or lens model exists."

[[hazard]]
id = "H01"
title = "Hot resume leaves the panel black"
effect = "Clicking the camui power ring during a run powered the camera off; the wake did a hot resume (DDR kept) but the panel stayed black, so the run had to be restarted."
evidence = ["doc:external-a6000-emulator/README.md"]
rule = "After a power-off (camui power ring), restart the emulator instead of waking it; the hot resume runs but the panel stays black."
