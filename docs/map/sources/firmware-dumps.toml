# Knowledge-map source: firmware dump sets and partition identity.
# See docs/map/README.md for the schema. Claims cite evidence records; the record
# index on the generated page is extracted from the files themselves.

[meta]
area = "firmware-dumps"
title = "Firmware dump sets and partition identity"
scope = """
The local ILCE-6100 and ILCE-6400 partition sets, their integrity against stored
manifests, the build identity each set carries, and which partitions are byte-identical
across the two bodies."""
evidence_span = "see record index"
reviewed = "2026-11-26"
records = [
  "E0707",
  "E9101",
  "E9201",
  "E9202",
  "E0414",
  "E0415",
  "E0524:reproducible",
  "E0477",
]
deep_reviewed = [
  "E0707",
]

[[entity]]
id = "source.a6100-dump"
kind = "source"
name = "ILCE-6100 Ver.1.00 partition set"
aliases = ["a6100-dump-20261120", "dumps/a6100-dump-20261120", "38115_03.2021040601"]
summary = "Fastboot fetch set of 19 nflasha images (1,361,051,648 bytes) with two passes from different fetch sessions and a 19/19 SHA-256 list."

[[entity]]
id = "source.a6400-dump"
