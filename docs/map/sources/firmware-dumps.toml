kind = "process"
name = "Dump integrity and cross-body comparison"
aliases = ["dump-inventory", "sha256sum -c"]
summary = "Recomputing each stored checksum, reading partition signatures and build strings, and comparing the same partition across bodies by SHA-256."

[[claim]]
id = "C01"
entities = ["source.a6100-dump", "proc.dump-integrity"]
status = "verified-physical"
text = "The ILCE-6100 fetch set is complete for its 19 listed images (1,361,051,648 bytes, 1,298 MiB): every partition has two passes from different fetch sessions, each pair agrees on SHA-256 and MD5, and all 19 entries in SHA256SUMS match. Session 2 ended on budget and was resumed; sessions 1, 3, 4 and 5 are complete."
evidence = ["E0707"]

[[claim]]
id = "C02"
entities = ["source.a6400-dump", "proc.dump-integrity"]
status = "verified-physical"
text = "The ILCE-6400 set holds 18 partition images (1,360,986,112 bytes) plus a 1 MiB head read and three filesystem archives. 38 of 39 SHA256SUMS.txt entries match; the only exception is the known manifest-final.json metadata mismatch first recorded in E0524, while every partition image and the head read match."
evidence = ["E0707", "E0524:reproducible", "E0414"]

[[claim]]
id = "C03"
entities = ["source.a6100-dump"]
status = "inference"
text = "The a6100 set is the dump E9101 examined: nflasha3 SHA-256 08379a20... matches it, and its bytes carry the build identity `Linux version 3.0.27_nl-rt106+` (dic-build-scm-354, 2021-04-06, Sony CE Linux 8.2.6.0) with nflasha7:/version.txt `38115_03.2021040601`. E9101 identifies that dump as ILCE-6100 Ver.1.00; the fetch manifest itself carries no model or version field, so the model name rests on that record, not on the bytes."
evidence = ["E0707", "E9101"]

[[claim]]
id = "C04"
entities = ["source.a6400-dump"]
status = "verified-offline"
text = "The a6400 set is a distinct build of the same release: nflasha7:/version.txt reads `38111_06.2021081003`, and the captured kernel banner is dic-build-scm-348, 2021-08-10, Sony CE Linux 8.2.6.0."
evidence = ["E0707", "E0415"]

[[claim]]
id = "C05"
entities = ["source.a6100-dump", "source.a6400-dump", "proc.dump-integrity"]
status = "verified-offline"
text = "The two sets share one 18-partition size map (1,360,986,112 bytes each; the a6100 adds a 65,536-byte nflasha_head), and exactly three partitions are byte-identical: nflasha16 (146,800,640 bytes, all zero), nflasha23 (2,097,152 bytes) and nflashaB1 (4,194,304 bytes, all zero). The other 15 differ, including nflasha1, nflasha5, nflasha7 and nflasha15."
evidence = ["E0707"]

[[claim]]
id = "C06"
entities = ["source.a6100-dump"]
status = "verified-offline"
text = "Observed formats in the a6100 set: FAT12 on nflasha1/2/3/6/10/12/13/18, FAT16 on nflasha11/17, ext2 on nflasha7 (1,216 inodes, 4,844 blocks) and nflasha15 (52,832 inodes, 211,164 blocks), WBI1 on nflasha5, an EXBL container on nflashaB0, an undecoded `CMMe` header on nflasha4, and all-zero nflasha16 and nflashaB1. nflasha7 carries 25 root names including version.txt; the a6100 adds tmp_ipsec to the a6400 set."
evidence = ["E0707"]

[[claim]]
id = "C07"
entities = ["source.a6100-dump", "source.a6400-dump"]
status = "inference"
text = "The shared nflasha23 bytes show the same 2 MiB partition content on both bodies, which is consistent with but does not attest the ILCE-6400A MSC LUN 1 backing that E0674 left unattested."
evidence = ["E0707"]

[[claim]]
id = "C08"
entities = ["source.a6700-camera-dump", "proc.dump-integrity"]
status = "verified-physical"
text = "Ten ILCE-6700 partitions that the 2.00 update does not carry (nflasha1, 2, 4, 6, 10, 11, 12, 13, 18, 22; 547,291,136 bytes) were read from the running camera with per-chunk SHA-1 agreement; nine are FAT and nflasha4 has no filesystem signature. The first 2 MiB of live nflasha7 equal the update image byte for byte. nflasha23 was deliberately not read, there is a single pass, and mounted partitions are live snapshots."
evidence = ["E9201"]

[[claim]]
id = "C09"
entities = ["source.a6700-camera-dump"]
status = "verified-offline"
text = "On the ILCE-6700 the Senser level tables (A/B/C) contain no FileControl 0xff01 or MemoryDump 0xff03, and libJiritsu carries the same 0x1001/0x4001..0x4012 command table as the a6400A; GET_FILE with a /.. path reads any non-empty regular file and an uploaded /tmp/jiritsu/libJit.so is dlopened once per boot. /tmp is /dev/nflasha10 but /tmp/jiritsu is the nflasha6 mount (vfat, rw, sync), so the uploaded run.sh and libJit.so are written to nflasha6 and removed afterwards."
evidence = ["E9201"]

[[claim]]
id = "C10"
entities = ["source.a6700-camera-dump"]
status = "inference"
text = "Every GET_FILE read that failed with status 0x10000006 concerned a file whose size is a multiple of 4096, and every read that succeeded did not; padding each chunk by three bytes made 1,000+ chunk reads succeed. The cause inside the Jiritsu read path is not identified."
evidence = ["E9201"]

[[claim]]
id = "C11"
entities = ["source.a6700-camera-dump"]
status = "verified-offline"
text = "The ILCE-6700 2.00 Linux 4.9.337 kernel boots on a new sony-a6700 QEMU machine built from the camera's device tree (EL3 hand-off, GIC-400, 2 MHz timer, five PL011, initrd ext2 root, real /sbin/init) then loads devno, dma330, crypt-emmc and emmc.ko; with stub contracts for the crypt-emmc OTP window, engine status and data window, an SDHCI at 0xF10D6000 and a replayed eMMC hand-off the eMMC is detected (4096 MiB) and the boot stops at 'partition table invalid' because the emulated eMMC has no Sony partition table. The image's EL3 code passes the device tree at RAM_BASE+0x2000. No UI, USB or TCP debugger exists for this body."
evidence = ["E9202"]

[[frontier]]
id = "F01"
title = "Acquisition provenance and a6100 partition roles"
state = "open"
entities = ["source.a6100-dump", "proc.dump-integrity"]
evidence = ["E0707"]
next = "Record the a6100 fetch conditions (service or normal mode, camera uptime, mount state) and read /proc/mounts read-only on the ILCE-6100 so its partition roles stop being inferred from the a6400; neither set is a whole-device image."

[[frontier]]
id = "F02"
title = "ILCE-6700 second pass and nflasha23"
state = "open"
entities = ["source.a6700-camera-dump"]
evidence = ["E9201"]
next = "Repeat the camera read in a fresh power cycle for two-pass agreement, decide with the owner whether nflasha23 (PMBP, 64 MiB) may be read, and keep the personal-data rules for nflasha2, 11 and 12."

[[hazard]]
id = "H01"
title = "Publishing or committing a dump set"
effect = "The sets contain proprietary firmware plus live settings, serials and Wi-Fi configuration; committing or uploading them would leak private device data."
rule = "Keep dumps under the git-ignored `dumps/` directory, never commit, attach or publish them, and cite only hashes, sizes and build strings."
evidence = ["E0707"]

[[hazard]]
id = "H02"
title = "Refreshing a stored hash to silence a mismatch"
effect = "A regenerated checksum would hide whether an image or a metadata file changed and destroy the capture's identity."
rule = "Investigate the mismatch and record it; never rewrite SHA256SUMS, manifest.json or manifest-final.json to make a check pass."
evidence = ["E0707", "E0524:reproducible"]
