[[claim]]
id = "C35"
entities = ["dev.lens"]
status = "verified-offline"
text = "Body-lens frames use a 0x320-byte slot with an item count at +0x18 and item pointers from +0x1C. Second-generation focus IDs are 0x41 POS_CYCLE_A, 0x43 MOVE_FC_2 (12-byte request), 0x44 FC_DRIVE_CYCLE, 0x45 search2 (17 bytes), 0x49 MoveFcVel2 (4 bytes), 0x4A MOVE_FC_CAP2 and 0x5B IS_LENS_SHIFT_CYCLE_A; first-generation items are 0x1C, 0x1D (5 bytes), 0x1F and 0x3C."
evidence = ["E0648"]

[[claim]]
id = "C36"
entities = ["dev.lens"]
status = "verified-offline"
text = "Each MOVE_FC_2 wrapper calls 0x63D12860(0x43) -> 0x63855F80 and falls back to the 5-byte 0x1D item when it returns 0; 0x63855F94 tests bit (id-1) of the bitmap at BL_LENS_DATA+1, IDs 0x41-0x49 also require [+0x20FC]+0x20 and a clear inhibit byte at 0x6448B4A0, and a camera-side mask table at 0x6448B366 gives the final answer."
evidence = ["E0648"]
note = "Inference (E0648 [I]): the lens's startup data selects second- or first-generation commands; the field meanings and units are not established."

[[claim]]
id = "C37"
entities = ["dev.lens"]
status = "verified-physical"
text = "With a Sigma 18-50 F2.8 DC DN attached, /proc/iomem lists System RAM 0x00000000-0x3FFFFFFF and 0x80000000-0x8FFFFFFF and no process maps the ORIL window 0x6xxxxxxx, so BL_LENS_DATA is unreachable through process memory; captured libObj data/bss and heap contain no lens name strings and no key 0xC06A paired with 0x2285/0x2286, and /lens (/dev/nflasha18) holds only Sony VX*_lensfile.bin correction files."
