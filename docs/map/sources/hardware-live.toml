[[claim]]
id = "C27"
entities = ["dev.gpes-bar"]
status = "verified-offline"
text = "The 0xC0048203 event wait requires mask & 0xC4000000, checks [dev+0xA8] and returns the status word. The 0xC004820D ctx wait's fast flag (ctx+0x10) is written only by the guest 0x820E signal handler, and its completion word (ctx+0x14) only by 0x820E, open or release; the IRQ never completes a guest ctx, so the hardware-log wait needs a guest 0x820E."
evidence = ["E0314"]

[[claim]]
id = "C28"
entities = ["dev.gpes-bar", "lib.libobj"]
status = "verified-offline"
text = "The opt-in --gles-engine-model command-completion replays the physically observed 0x40000000 IRQ class after the guest submits the BAR command (BAR+0xE8=1, +0xEA=5), performs the decoded acks and consumes the ring header; it never completes a guest ctx and injects no signal. In engine11 the guest exited the 0x72B660 loop, issued a second 0x820E and parked at 0x72BAF0."
evidence = ["E0314"]

[[claim]]
id = "C29"
