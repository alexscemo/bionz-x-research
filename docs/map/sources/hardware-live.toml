[[entity]]
id = "policy.devmem"
kind = "process"
name = "/dev/mem access policy"
aliases = ["PA 0x000F8000", "devmem_policy.py"]
summary = "Single-page /dev/mem reads are gated by tools/devmem_policy.py: verified pages only, per-address go-ahead for device/SRAM pages, DRAM and bulk reads forbidden; first-MiB pages need catching=True plus a go-ahead."

[[entity]]
id = "dev.lens"
kind = "device"
name = "Body-lens (BL) interface"
aliases = ["BL_LENS_DATA", "0x642FE7B8", "capability gate", "0x63855F94"]
summary = "Body-lens focus command IDs, the capability bitmap at BL_LENS_DATA+1, the body mask that admits 0x41-0x4A for any lens, and the three-bit 0x1D mode; the TTArtisan lens implements only the legacy items."

