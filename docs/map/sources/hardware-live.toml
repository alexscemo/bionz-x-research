[[hazard]]
id = "H03"
title = "Bulk /dev/mem physical scan"
effect = "A 16 MiB-chunk /dev/mem scan dropped the camera's USB and rebooted it (uptime reset to 61 s); the camera recovered with no persistent change."
rule = "Bulk physical sweeps are excluded from the standing read-only allowance. Only bounded single-page reads with a policy go-ahead, /proc, /sys and kallsyms views are allowed; a bulk scan needs explicit per-incident user approval."
evidence = ["E0314", "E0647"]

[[hazard]]
id = "H04"
title = "Uncaught external abort in a /dev/mem reader"
effect = "A user-mode external abort with no SIGBUS handler reaches the default core-dump path and em_exception_monitor, which warm-reboots the body even though the fault was precise."
rule = "Any reader of a GO page must install SIGBUS/SIGSEGV handling (ro_page v2, catching=True) and report the caught fault; imprecise aborts and kernel-mode faults (read() on /dev/mem) cannot be caught and stay forbidden."
evidence = ["E0647"]

[[frontier]]
id = "F01"
title = "Reserved first MiB: what is at 0x000F8000 and what else may be read?"
state = "blocked-on-user-go"
entities = ["policy.devmem", "tool.ro-page", "sys.camera-memory"]
evidence = ["E0647"]
candidate = "ro_page v2 (529,412 bytes, SHA-256 8c9f360b...5c64) with catching=True, one 4 KiB page per boot."
verified = "Same FSR 0x008 fault as the reboot, caught as signal 7 on the camera with uptime 3,198.8 -> 3,243.9 s; not a map of the window."
next = "Bound the first-MiB window with a per-address go-ahead, one page per boot, starting far from 0xF8000; DRAM and read() on /dev/mem stay forbidden."
read_in_result = "The user-mode fault is reported and caught, the exception monitor stays silent, /proc/uptime remains monotonic, and the page decodes as a device or SRAM page rather than returning zeros."

