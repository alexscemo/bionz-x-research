[[claim]]
id = "C38"
entities = ["process.im-elf"]
status = "verified-physical"
text = "im.elf is not started with execve at power-on: the bootloader restores its address space from /system/sabin/ssboot.bin (warm.mode=2 DDR self-refresh), so /etc/ld.so.preload is not applied to im.elf, while daemons started later by shell scripts (for example bsa_server) do parse it."
evidence = ["E0084"]
note = "The touch-scanner claims in the same record are retracted by E0085/E0086; this boot finding is independent of them."

[[claim]]
id = "C39"
entities = ["lib.libobj", "dev.touch-input"]
status = "verified-offline"
text = "The six-byte prologue 98 b5 00 af 04 46 appears 375 times in libObj executable segments, so it is not a function identity and a patch at its first match proves byte modification only. PAS_MenuSelectMode::setTouchable is at linked 0x56dcb0; its two-byte CBZ at +6 must survive, because the old four-byte NOP also overwrote the following LDR.W and left 08 31 (ADD)."
evidence = ["E0085", "E0086"]

[[hazard]]
id = "H01"
title = "Reading /dev/stream for OSD capture"
effect = "The camera rebooted during the OSD probe."
rule = "Never read /dev/stream for capture; use host-side ptrace of im.elf's existing mapping (E0298)."
evidence = ["E0297", "E0298"]

[[hazard]]
id = "H02"
title = "Unvetted /dev/mem pages"
effect = "External abort on PA 0x000F8000 warm-rebooted the camera."
rule = "Every /dev/mem access passes tools/devmem_policy.py; never bulk-scan physical memory or read DRAM through /dev/mem."
