[[claim]]
id = "C31"
entities = ["policy.devmem"]
status = "verified-physical"
text = "tools/devmem_policy.py allows only 0xF2915000 as a standing page; device-map pages and SRAM need a per-address go-ahead; the reserved first MiB and DRAM are forbidden; multi-page ranges, unaligned addresses and read()/write() on /dev/mem, /dev/kmem or /dev/stream are forbidden. With catching=True the first MiB and undecoded holes become per-address GO."
evidence = ["E0647"]

[[claim]]
id = "C32"
entities = ["policy.devmem"]
status = "verified-offline"
text = "The kernel does not guard /dev/mem: there is no STRICT_DEVMEM devmem_is_allowed symbol, valid_mmap_phys_addr_range (0x601180EC) accepts any range below 4 GiB, and phys_mem_access_prot_allowed (0x6011F550) acts on conflicts only when mmap.debug != 0. /sys/module/mmap/parameters/debug reads 0 on the camera."
evidence = ["E0647"]

[[claim]]
id = "C33"
entities = ["policy.devmem", "tool.ro-page"]
status = "verified-physical"
