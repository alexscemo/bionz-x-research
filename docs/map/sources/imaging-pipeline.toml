[[claim]]
id = "C19"
entities = ["img.recording-paths"]
status = "verified-offline"
text = "The userspace size request in libmpr.so transports a picture-size id, not a (w,h) pair: 0x272570 is a (w,h,kind)-to-id table search and RecStartAvcHdContent (0x2B4F6C) stores that id at request+4, while no code in the AviSeqRec region packs a (w,h) pair; av-cam.bin carries 32 (3840,2160) u16 pairs (14 of them in a previously unlisted family at 0x63E369D0..0x63E37C80), and the entry edge of 0x63957ED8 is absent from every static encoding (absolute LE/BE, self-relative, adjacent halves, TBH, BL/BLX/B/ldr+add/ADR/movw-movt). The userspace-to-av-cam segment of the Round-5 graph is therefore not verified, and the premise that userspace sends (3840,2160) over UIPC is refuted as stated."
evidence = ["E0729"]

[[claim]]
id = "C20"
entities = ["img.recording-paths"]
status = "verified-offline"
