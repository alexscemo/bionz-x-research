text = "OpenGate32.mod (9,788 B) and OpenGateSensor.mod (6,672 B) SMOD v2 + SMNU nested-submenu builds for ILCE-6400 (2.00 captured) and ILCE-6400A (1.01) expose three Sensor Gate tiers -- (0) 5.1K True 4K default keeping unbinned IMX284 Mode 16/17 (5064x3376 17.1 MP @ 24p/25p, stock FE <= 3445) & Mode 15 (4140x2760 11.4 MP @ 30p) supersampled into 3240x2160, (1) 6K Reg01 Full flipping col 11 reg 0x0001 0x41 -> 0x40 + dy=+624 (6000x4000) + S-Ele 0x603F -> 0xBF00 crash guard, and (2) Full-FOV 2K Mode 10 (0x44, 1996x1332 1.00x FOV) -- synchronized across ExlHelper, DMM, VPI, ZIMA DVENC, and libmpr.so (MprLibCore::EncOpen .text immediates + .rodata) with live SMNU reconfiguration and byte-exact OFF restoration, verified in real-firmware Unicorn and full-system sony-a6400 QEMU."
