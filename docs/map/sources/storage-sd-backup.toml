[[claim]]
id = "C08"
entities = ["mod.emunand-prototype", "dev.sd-stack", "proc.backup"]
status = "verified-offline"
text = "A reversible emulator prototype (emunand_guard.ko + freestanding FAT32/exFAT emunand_vdisk_ctl.elf + emunand_session.sh) mounts an ext2 CFW_VDISK.IMG zero-copy from raw /dev/mmca1 without a Linux VFS SD mount, sinks user/MPR/WBI/B0/B1 eMMC writes into a 2 MiB RAM CoW table with 0 QMP block writes and Backup_save=0, and restores original prologues, BLKFLSBUF caches and settings on stop in Unicorn and 4-core QEMU."
evidence = ["E0742"]

[[claim]]
id = "C09"
entities = ["mod.emunand-prototype", "dev.sd-stack"]
status = "verified-offline"
text = "Extracted Sony flashable partition packages (0700_part_image/dev/nflasha3 vfat, nflasha7/nflasha15 ext2, 0400_updater/dev/nflasha1 vfat + nested ext2/cramfs initrd.img) and Custom-OS ext2 rootfs packages mount simultaneously zero-copy from a 64 MiB exFAT SD card across loop0..loop5 in 4-core QEMU (overmounting /system, executing chroot ARM binaries, and rejecting non-FS WBI1 blobs with rc=6), whereas switching the active kernel/av-cam in DRAM still requires a ramboot/kexec handover."
evidence = ["E0742"]

[[hazard]]
id = "H01"
title = "Persisted settings written from RAM"
effect = "Forced Backup.bin values (1080p NVRAM patch) survived power cycles and stalled the cold boot."
rule = "Treat /setting/Backup.* as persistent: RAM patches to backed-up tables are saved on power-off. Never write it without explicit scope."
evidence = ["E0138", "E0137"]

[[hazard]]
id = "H02"
title = "Physical SD card is an input, not a scratch disk"
effect = "SD changes can corrupt camera state or lose captures."
rule = "Physical SD (E:) is read-only for emulator inputs; diagnostic writes stay under /tmp_bt unless explicitly authorized."
evidence = ["E0056", "E0219"]

[[frontier]]
id = "F01"
title = "Zero-scratch read-only DCIM/100MSDCF USTAR streaming from /dev/mmca1"
state = "not-started"
entities = ["dev.sd-stack"]
evidence = ["E0056", "E0689"]
next = "Extend card_read.c's read-only FAT32/exFAT parser (/dev/mmca1 250:11) with 2-level DCIM/100MSDCF lookup and stream 16 KiB-page-aligned POSIX ustar headers + ARW clusters over a backpressured socket with 0 B written to /tmp_bt or SD."
